version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campusfind-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  ai-service:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: campusfind-ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - mongodb

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusfind-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/campusfind_ai
      - CLIENT_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - ai-service
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: campusfind-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
